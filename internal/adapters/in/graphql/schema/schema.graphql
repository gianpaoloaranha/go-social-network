# GraphQL schema example
#
# https://gqlgen.com/getting-started/

################
# SCALAR TYPES #
################

scalar DateTime

directive @auth on FIELD_DEFINITION


################
# OBJECT TYPES #
################

type User {
  id: ID!
  name: String!
  email: String!
  following: [User!]!
  followers: [User!]!
  posts: [Post!]!
}

type Post {
  id: ID!
  description: String!
  author: User!
  comments: [Comment!]!
  createdAt: DateTime!
}

type Comment {
  id: ID!
  message: String!
  author: User!
  createdAt: DateTime!
}


###############
# INPUT TYPES #
###############

# --- User inputs ---
input CreateUserInput {
  name: String!
  email: String!
  password: String!
}

input UpdateUserInput {
  name: String
  email: String
  password: String
}

input FollowUserInput {
  userToFollowId: ID!
}

input UnfollowUserInput {
  userToUnfollowId: ID!
}

# --- Post inputs ---
input CreatePostInput {
  description: String!
}

input UpdatePostInput {
  postId: ID!
  description: String!
}

# --- Comment inputs ---
input CreateCommentInput {
  postId: ID!
  message: String!
}

input UpdateCommentInput {
  commentId: ID!
  message: String!
}


############
# PAYLOADS #
############

type Error {
  field: String!
  message: String!
}

type UserPayload {
  user: User
  errors: [Error!]
}

type PostPayload {
  post: Post
  errors: [Error!]
}

type CommentPayload {
  comment: Comment
  errors: [Error!]
}

type DeletePayload {
  status: Boolean!
  errors: [Error!]
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
  errors: [Error!]
}

###########
# QUERIES #
###########

type Query {
  user(userId: ID!): User!
  users: [User!]!

  post(postId: ID!): Post!
  userPosts(userId: ID!): [Post!]!

  comment(commentId: ID!): Comment!
  postComments(postId: ID!): [Comment!]!
}


#############
# MUTATIONS #
#############

type Mutation {
  # --- Authentications mutations ---
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refreshToken: String!): AuthPayload!
  logout: Boolean! @auth

  # --- User mutations ---
  createUser(input: CreateUserInput!): UserPayload!
  updateUser(input: UpdateUserInput!): UserPayload! @auth
  deleteUser: DeletePayload! @auth
  followUser(input: FollowUserInput!): UserPayload! @auth
  unfollowUser(input: UnfollowUserInput!): UserPayload! @auth

  # --- Post mutations ---
  createPost(input: CreatePostInput!): PostPayload! @auth
  updatePost(input: UpdatePostInput!): PostPayload! @auth
  deletePost(postId: ID!): DeletePayload! @auth

  # --- Comment mutations ---
  createComment(input: CreateCommentInput!): CommentPayload! @auth
  updateComment(input: UpdateCommentInput!): CommentPayload! @auth
  deleteComment(commentId: ID!): DeletePayload! @auth
}


#################
# SUBSCRIPTIONS #
#################

type Subscription {
  postCreated: Post!
  commentAdded(postId: ID!): Comment!
}
